{% load form_tags %}
{% load static %}

<style>
  /* Tailwind CSS와의 충돌을 방지하기 위한 고유 클래스명 사용 */
  .yolo-login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 64px);
    padding: 20px;
    background-color: #0f0f23;
    font-family: "Inter", sans-serif;
    color: #ffffff;
  }

  .yolo-auth-container {
    width: 100%;
    max-width: 450px;
  }

  .yolo-auth-card {
    background: #1a1a2e;
    border-radius: 20px;
    padding: 50px 40px;
    backdrop-filter: blur(10px);
    border: 1px solid #16213e;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
    overflow: hidden;
  }

  .yolo-auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(135deg, #3b82f6, #e94560);
  }

  .yolo-auth-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .yolo-auth-logo {
    font-size: 2.5em;
    font-weight: 700;
    background: linear-gradient(135deg, #3b82f6, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .yolo-auth-subtitle {
    color: #a8a8a8;
    font-size: 1.1em;
    margin-bottom: 30px;
  }

  .yolo-form-group {
    margin-bottom: 25px;
  }

  .yolo-form-label {
    color: #ffffff;
    font-weight: 500;
    margin-bottom: 10px;
    display: block;
    font-size: 0.95em;
  }

  .yolo-form-control {
    background: #0f3460 !important;
    border: 2px solid #533483 !important;
    border-radius: 12px !important;
    color: #ffffff !important;
    padding: 15px 18px !important;
    width: 100% !important;
    box-sizing: border-box !important;
    font-size: 16px !important;
    transition: all 0.3s ease !important;
  }

  .yolo-form-control:focus {
    background: #0f3460 !important;
    border-color: #e94560 !important;
    outline: none !important;
    box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2) !important;
    transform: translateY(-2px) !important;
  }

  .yolo-form-control::placeholder {
    color: #a8a8a8 !important;
  }

  .yolo-btn-primary {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
    color: white !important;
    border: none !important;
    padding: 16px 30px !important;
    border-radius: 12px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: all 0.3s ease !important;
    width: 100% !important;
    font-size: 16px !important;
    margin-bottom: 20px !important;
  }

  .yolo-btn-primary:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e3a8a) !important;
    transform: translateY(-3px) !important;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4) !important;
  }

  .yolo-btn-secondary {
    background: rgba(255, 255, 255, 0.1) !important;
    color: white !important;
    border: 2px solid rgba(255, 255, 255, 0.2) !important;
    padding: 16px 30px !important;
    border-radius: 12px !important;
    text-decoration: none !important;
    display: inline-block !important;
    transition: all 0.3s ease !important;
    text-align: center !important;
    width: 100% !important;
    font-weight: 500 !important;
    font-size: 16px !important;
  }

  .yolo-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
    text-decoration: none !important;
    color: white !important;
    transform: translateY(-2px) !important;
  }

  .yolo-error-message {
    background: rgba(239, 68, 68, 0.1) !important;
    color: #ef4444 !important;
    font-size: 0.9em !important;
    margin-bottom: 20px !important;
    text-align: center !important;
    padding: 12px !important;
    border-radius: 8px !important;
    border: 1px solid rgba(239, 68, 68, 0.3) !important;
  }

  .yolo-success-message {
    background: rgba(34, 197, 94, 0.1) !important;
    color: #22c55e !important;
    font-size: 0.9em !important;
    margin-bottom: 20px !important;
    text-align: center !important;
    padding: 12px !important;
    border-radius: 8px !important;
    border: 1px solid rgba(34, 197, 94, 0.3) !important;
  }

  .yolo-auth-footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .yolo-auth-footer a {
    color: #3b82f6;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  .yolo-auth-footer a:hover {
    color: #e94560;
  }

  .yolo-toggle-form {
    background: none;
    border: none;
    color: #3b82f6;
    cursor: pointer;
    font-size: 0.9em;
    text-decoration: underline;
    margin-top: 15px;
  }

  .yolo-toggle-form:hover {
    color: #e94560;
  }

  .yolo-form-container {
    display: none;
  }

  .yolo-form-container.active {
    display: block;
  }
</style>

<div class="yolo-login-page">
  <div class="yolo-auth-container">
    <div class="yolo-auth-card">
      <div class="yolo-auth-header">
        <div class="yolo-auth-logo">YOLO</div>
        <div class="yolo-auth-subtitle">AI 객체 탐지 시스템</div>
      </div>

      <!-- 로그인 폼 -->
      <div id="login-form" class="yolo-form-container active">
        <h3 style="text-align: center; margin-bottom: 30px; font-size: 1.5em; color: #ffffff;">로그인</h3>
        
        {% if form.errors %}
        <div class="yolo-error-message">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        {% endif %}
        
        <form method="post">
          {% csrf_token %}
          <div class="yolo-form-group">
            <label for="id_username" class="yolo-form-label">아이디</label>
            {{ form.username|add_class:"yolo-form-control" }}
          </div>
          <div class="yolo-form-group">
            <label for="id_password" class="yolo-form-label">비밀번호</label>
            {{ form.password|add_class:"yolo-form-control" }}
          </div>
          <button type="submit" class="yolo-btn-primary">로그인</button>
        </form>
        
        <button class="yolo-toggle-form" onclick="showRegisterForm()">회원가입하기</button>
      </div>

      <!-- 회원가입 폼 -->
      <div id="register-form" class="yolo-form-container">
        <h3 style="text-align: center; margin-bottom: 30px; font-size: 1.5em; color: #ffffff;">회원가입</h3>
        
        <form method="post" action="/register/">
          {% csrf_token %}
          <div class="yolo-form-group">
            <label for="reg_username" class="yolo-form-label">아이디</label>
            <input type="text" id="reg_username" name="username" class="yolo-form-control" placeholder="아이디를 입력하세요" required>
          </div>
          <div class="yolo-form-group">
            <label for="reg_email" class="yolo-form-label">이메일</label>
            <input type="email" id="reg_email" name="email" class="yolo-form-control" placeholder="이메일을 입력하세요" required>
          </div>
          <div class="yolo-form-group">
            <label for="reg_password1" class="yolo-form-label">비밀번호</label>
            <input type="password" id="reg_password1" name="password1" class="yolo-form-control" placeholder="비밀번호를 입력하세요" required>
          </div>
          <div class="yolo-form-group">
            <label for="reg_password2" class="yolo-form-label">비밀번호 확인</label>
            <input type="password" id="reg_password2" name="password2" class="yolo-form-control" placeholder="비밀번호를 다시 입력하세요" required>
          </div>
          <button type="submit" class="yolo-btn-primary">회원가입</button>
        </form>
        
        <button class="yolo-toggle-form" onclick="showLoginForm()">로그인하기</button>
      </div>

      <div class="yolo-auth-footer">
        <a href="/" class="yolo-btn-secondary">메인으로 돌아가기</a>
      </div>
    </div>
  </div>
</div>

<script>
  function showRegisterForm() {
    document.getElementById('login-form').classList.remove('active');
    document.getElementById('register-form').classList.add('active');
  }

  function showLoginForm() {
    document.getElementById('register-form').classList.remove('active');
    document.getElementById('login-form').classList.add('active');
  }
</script>
