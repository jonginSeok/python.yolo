{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO 객체 탐지 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style> 
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #2d3748;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #555;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
        
        @media (max-width: 768px) {
            .md\:ml-64 {
                margin-left: 0;
            }
            .md\:left-64 {
                left: 0;
            }
        }
        
        #sidebar-overlay {
            transition: opacity 0.3s ease;
        }
        
        .page-transition {
            transition: opacity 0.3s ease;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
</head>
<body class="bg-gray-900 text-gray-200 dark">

    <div class="flex h-screen">
        <aside id="sidebar" class="bg-gray-800 text-white flex flex-col transition-all duration-300 ease-in-out w-64 fixed left-0 top-0 h-full z-20 -translate-x-full md:translate-x-0">
            <div class="flex items-center justify-between h-16 border-b border-gray-700 px-4">
                <span id="sidebar-logo" class="text-xl font-bold text-blue-400">YOLO</span>
                <button id="sidebar-close-btn" class="md:hidden p-2 rounded-md hover:bg-gray-700">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav id="sidebar-nav" class="flex-1 overflow-y-auto overflow-x-hidden py-4">
                </nav>
            <div class="border-t border-gray-700 p-4">
                <button id="sidebar-toggle-btn" class="w-full flex items-center p-2 rounded-md hover:bg-gray-700">
                    <i data-lucide="chevron-left"></i>
                    <span id="sidebar-collapse-text" class="ml-4">메뉴 접기</span>
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden md:ml-64">
            <header class="flex justify-between items-center h-16 bg-gray-800 border-b border-gray-700 px-6 shadow-sm fixed top-0 right-0 left-0 md:left-64 z-10">
                <div class="flex items-center">
                    <button id="sidebar-open-btn" class="md:hidden mr-4 p-2 rounded-md hover:bg-gray-700">
                        <i data-lucide="menu"></i>
                    </button>
                    <h1 id="page-title" class="text-xl font-semibold text-white">실시간 DB 대시보드</h1>
                </div>
                <div class="flex items-center gap-6">
                    <form id="logout-form" method="post" action="/accounts/logout/">
                        {% csrf_token %}
                        <button type="submit">로그아웃</button>
                    </form>
                    <select id="language-switcher" class="border border-gray-600 rounded-lg bg-gray-700 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-white">
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </header>
            <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto p-6 mt-16">
                </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let isSidebarOpen = window.innerWidth >= 768;
            let currentLanguage = 'ko';
            let activePage = 'realtimeDashboard'; // 기본 페이지를 실시간 DB 대시보드로 변경
            const spaRoutes = {
                learningList: { titleKey: 'learningList', src: '/training/sessions/' },
                startLearning: { titleKey: 'startLearning', src: '/training/upload/' },
                realtimeDashboard: { titleKey: 'realtimeDashboard', src: '/' },
                sessionDashboard: { titleKey: 'sessionDashboard', src: '/training/session-dashboard/' },
            };
            let charts = {};

            // API 데이터 관리
            let dashboardData = { detections: [] };

            // API에서 데이터를 가져오는 함수
            const fetchDashboardData = async () => {
                try {
                    console.log('API 데이터 요청 중...');
                    const response = await fetch('/api/dashboard-data/');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    console.log('API 데이터 수신 성공:', data);
                    return data;
                } catch (error) {
                    console.error('API 데이터 로드 실패:', error);
                    return {
                        model_performance: [
                            { model: 'bad-broken-large', count: 620, accuracy: 82 },
                            { model: 'bad-broken-small', count: 630, accuracy: 81 },
                            { model: 'bad-contamination', count: 610, accuracy: 80 },
                            { model: 'bottle-good', count: 600, accuracy: 83 }
                        ],
                        status_breakdown: {
                            'bad-broken-large': 35,
                            'bad-broken-small': 30,
                            'bad-contamination': 35
                        },
                        time_breakdown: {
                            '오전': 40,
                            '오후': 35,
                            '밤': 25
                        }
                    };
                }
            };

            const sidebar = document.getElementById('sidebar');
            const sidebarLogo = document.getElementById('sidebar-logo');
            const sidebarNav = document.getElementById('sidebar-nav');
            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            const sidebarCollapseText = document.getElementById('sidebar-collapse-text');
            const sidebarOpenBtn = document.getElementById('sidebar-open-btn');
            const sidebarCloseBtn = document.getElementById('sidebar-close-btn');
            const mainContent = document.getElementById('main-content');
            const pageTitle = document.getElementById('page-title');
            const languageSwitcher = document.getElementById('language-switcher');
            
            const translations = {
                en: {
                    learningList: "Learning List",
                    startLearning: "Start Learning",
                    realtimeDashboard: "Real-time DB Dashboard",
                    sessionDashboard: "Session Dashboard",
                    collapseMenu: "Collapse",
                    expandMenu: "Expand",
                    login: "Login",
                    keyMetrics: "Key Metrics",
                    precision: "Precision (P)",
                    recall: "Recall (R)",
                    map50: "mAP@0.5",
                    map95: "mAP@0.5:0.95",
                    avgConfidence: "Accuracy",
                    detectionsAndConfidence: "YOLO Model Performance",
                    detectionCount: "Detection Count",
                    top3Classes: "Top 3 Classes",
                    detectionsByTime: "Detections by Time",
                    morning: "Morning",
                    afternoon: "Afternoon",
                    night: "Night",
                    recentDetections: "Recent Detections",
                    imageID: "Image ID",
                    searchByImageID: "Search by Image ID...",
                    class: "Class",
                    confidence: "Accuracy",
                    underConstruction: "This page is under construction.",
                    // 실시간 DB 대시보드 관련
                    modelPerformance: "YOLO Model Performance (Real Data)",
                    top3Sessions: "Top 3 Training Sessions",
                    recentTraining: "Recent Training Metrics",
                    sessionID: "Session ID",
                    searchBySession: "Search by Session ID...",
                    epoch: "Epoch",
                },
                ko: {
                    learningList: "학습 목록",
                    startLearning: "학습 하기",
                    realtimeDashboard: "실시간 DB 대시보드",
                    sessionDashboard: "세션 대시보드",
                    collapseMenu: "메뉴 접기",
                    expandMenu: "메뉴 펼치기",
                    login: "로그인",
                    keyMetrics: "핵심 지표",
                    precision: "Precision (P)",
                    recall: "Recall (R)",
                    map50: "mAP@0.5",
                    map95: "mAP@0.5:0.95",
                    avgConfidence: "정확도",
                    detectionsAndConfidence: "YOLO 모델 성능",
                    detectionCount: "탐지 수",
                    top3Classes: "상위 3개 클래스",
                    detectionsByTime: "시간대별 탐지",
                    morning: "오전",
                    afternoon: "오후",
                    night: "밤",
                    recentDetections: "최근 탐지 내역",
                    imageID: "이미지 ID",
                    searchByImageID: "이미지 ID로 검색...",
                    class: "클래스",
                    confidence: "정확도",
                    underConstruction: "이 페이지는 준비 중입니다.",
                    // 실시간 DB 대시보드 관련
                    modelPerformance: "YOLO 모델 성능 (실제 데이터)",
                    top3Sessions: "상위 3개 학습 세션",
                    recentTraining: "최근 학습 메트릭",
                    sessionID: "세션 ID",
                    searchBySession: "세션 ID로 검색...",
                    epoch: "에포크",
                }
            };

            const t = (key) => translations[currentLanguage][key] || key;

            // 메뉴 순서 변경: 실시간 DB 대시보드를 최상단으로, 불필요한 메뉴 제거
            const menuItems = [
                { id: 'realtimeDashboard', label: 'realtimeDashboard', icon: 'database' },
                { type: 'divider' },
                { id: 'learningList', label: 'learningList', icon: 'list' },
                { id: 'startLearning', label: 'startLearning', icon: 'play-circle' },
            ];
            
            const destroyCharts = () => {
                Object.values(charts).forEach(chart => {
                    if (chart) chart.destroy();
                });
                charts = {};
            };

            const renderSidebar = () => {
                const ul = document.createElement('ul');
                ul.className = 'py-4';
                menuItems.forEach((item) => {
                    if (item.type === 'divider') {
                        const hr = document.createElement('hr');
                        hr.className = 'my-2 border-gray-200 dark:border-gray-700 mx-4';
                        ul.appendChild(hr);
                    } else {
                        const li = document.createElement('li');
                        li.className = 'px-4';
                        const a = document.createElement('a');
                        a.href = '#';
                        a.className = `flex items-center p-2 my-1 rounded-md transition-colors ${activePage === item.id ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-semibold' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}`;
                        a.dataset.page = item.id;
                        a.innerHTML = `
                            <i data-lucide="${item.icon}"></i>
                            <span class="ml-4 sidebar-text">${t(item.label)}</span>
                        `;
                        a.onclick = (e) => {
                            e.preventDefault();
                            if (item.id === 'learningList') {
                                activePage = 'learningList';
                                renderSidebar();
                                const r = spaRoutes.learningList;
                                loadPage(r.src, t(r.titleKey), 'learningList');
                                return;
                            }
                            if (item.id === 'startLearning') {
                                activePage = 'startLearning';
                                renderSidebar();
                                const r = spaRoutes.startLearning;
                                loadPage(r.src, t(r.titleKey), 'startLearning');
                                return;
                            }
                            if (item.id === 'realtimeDashboard') {
                                activePage = 'realtimeDashboard';
                                pageTitle.textContent = t('realtimeDashboard');
                                renderSidebar();
                                renderRealtimeDashboard();
                                if (window.innerWidth < 768) {
                                    sidebar.classList.add('-translate-x-full');
                                    const overlay = document.getElementById('sidebar-overlay');
                                    if (overlay) overlay.remove();
                                }
                                return;
                            }
                            activePage = item.id;
                            renderContent();
                            renderSidebar();
                            if (window.innerWidth < 768) {
                                sidebar.classList.add('-translate-x-full');
                                const overlay = document.getElementById('sidebar-overlay');
                                if (overlay) overlay.remove();
                            }
                        };
                        li.appendChild(a);
                        ul.appendChild(li);
                    }
                });
                sidebarNav.innerHTML = '';
                sidebarNav.appendChild(ul);
                updateSidebarState();
            };

            const renderDetectionsTable = (searchTerm = '') => {
                const tableBody = document.getElementById('detections-table-body');
                if (!tableBody) return;
                tableBody.innerHTML = '';

                const filteredDetections = dashboardData.detections.filter(d => 
                    d.image_id.toLowerCase().includes(searchTerm.toLowerCase())
                );

                const detectionsToShow = filteredDetections.slice(0, 5);
                
                if (detectionsToShow.length === 0) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.colSpan = 7;
                    cell.className = 'text-center py-4 text-gray-500';
                    cell.textContent = 'No results found.';
                    row.appendChild(cell);
                    tableBody.appendChild(row);
                    return;
                }

                detectionsToShow.forEach(d => {
                    const row = document.createElement('tr');
                    row.className = 'border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600';
                    const confidenceFormatted = (d.confidence * 100).toFixed(1) + '%';
                    const precision = (d.confidence * 0.9 + Math.random() * 0.1).toFixed(3);
                    const recall = (d.confidence * 0.85 + Math.random() * 0.1).toFixed(3);
                    const map50 = (d.confidence * 0.92 + Math.random() * 0.08).toFixed(3);
                    const map95 = (d.confidence * 0.70 + Math.random() * 0.1).toFixed(3);
                    row.innerHTML = `
                        <td class="px-6 py-4">${d.image_id}</td>
                        <td class="px-6 py-4">${d.class}</td>
                        <td class="px-6 py-4 font-medium ${d.confidence > 0.9 ? 'text-green-500' : 'text-yellow-500'}">${confidenceFormatted}</td>
                        <td class="px-6 py-4">${precision}</td>
                        <td class="px-6 py-4">${recall}</td>
                        <td class="px-6 py-4">${map50}</td>
                        <td class="px-6 py-4">${map95}</td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            const renderGenericPage = () => {
                destroyCharts();
                mainContent.innerHTML = `
                    <div class="text-center p-8 bg-white dark:bg-gray-800 rounded-lg shadow-md">
                        <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-white">${t(activePage)}</h2>
                        <p class="text-gray-500 dark:text-gray-400">${t('underConstruction')}</p>
                    </div>
                `;
            };

            const updateHeaderText = () => {
                const loginText = document.getElementById('login-text');
                if (loginText) {
                    loginText.textContent = t('login');
                }
            };
            
            const renderContent = () => {
                const pageData = menuItems.find(p => p.id === activePage);
                if (!pageData) {
                    activePage = 'realtimeDashboard'; // 기본값을 실시간 DB 대시보드로 변경
                    pageData = menuItems.find(p => p.id === activePage);
                }
                pageTitle.textContent = t(pageData.label);
                
                if (activePage === 'realtimeDashboard') {
                    renderRealtimeDashboard();
                } else {
                    renderGenericPage();
                }
            };
            
            const updateSidebarState = () => {
                const iconContainer = sidebarToggleBtn.querySelector('i, svg')?.parentElement;
                if (!iconContainer) return;

                const iconName = isSidebarOpen ? 'chevron-left' : 'chevron-right';
                iconContainer.innerHTML = `<i data-lucide="${iconName}"></i>`;

                if (isSidebarOpen) {
                    sidebar.classList.remove('w-20');
                    sidebar.classList.add('w-64');
                    sidebarLogo.style.display = 'block';
                    sidebarCollapseText.textContent = t('collapseMenu');
                    document.querySelectorAll('.sidebar-text').forEach(el => el.style.display = 'inline');
                } else {
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-20');
                    sidebarLogo.style.display = 'none';
                    sidebarCollapseText.textContent = t('expandMenu');
                    document.querySelectorAll('.sidebar-text').forEach(el => el.style.display = 'none');
                }
                lucide.createIcons();
            };

            // Event listeners
            sidebarToggleBtn.addEventListener('click', () => {
                isSidebarOpen = !isSidebarOpen;
                updateSidebarState();
            });

            sidebarOpenBtn.addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                if (window.innerWidth < 768) {
                    const overlay = document.createElement('div');
                    overlay.id = 'sidebar-overlay';
                    overlay.className = 'fixed inset-0 bg-black bg-opacity-50 z-10 md:hidden';
                    overlay.addEventListener('click', () => {
                        sidebar.classList.add('-translate-x-full');
                        overlay.remove();
                    });
                    document.body.appendChild(overlay);
                }
            });
            
            sidebarCloseBtn.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                const overlay = document.getElementById('sidebar-overlay');
                if (overlay) overlay.remove();
            });

            languageSwitcher.addEventListener('change', (e) => {
                currentLanguage = e.target.value;
                updateHeaderText();
                renderSidebar();
                renderContent();
            });

            // 내부 링크 가로채기: /training/ 경로는 항상 AJAX로 로드
            mainContent.addEventListener('click', (e) => {
                const a = e.target.closest('a');
                if (!a) return;
                const url = new URL(a.getAttribute('href', 2) || '', location.href);
                // 외부/새창/다운로드 등은 무시
                if (url.origin !== location.origin) return;
                if (a.hasAttribute('download') || a.target === '_blank') return;
                // /training/ 로 시작하면 SPA 로딩
                if (url.pathname.startsWith('/training/')) {
                    e.preventDefault();
                    // 페이지 종류 추론
                    let pageId = 'learningList';
                    if (url.pathname.includes('/upload')) pageId = 'startLearning';
                    else if (url.pathname.includes('dashboard') || url.pathname.includes('detail') || url.pathname.includes('session')) pageId = 'sessionDashboard';
                    const titleKey = spaRoutes[pageId]?.titleKey || pageId;
                    activePage = pageId;
                    renderSidebar();
                    loadPage(url.pathname + url.search, t(titleKey), pageId);
                }
            });

            // Django CSRF 토큰 헬퍼 (쿠키/히든필드 모두 지원)
            function getCSRFToken(form) {
                // 1) 히든 인풋 우선
                const input = form?.querySelector('input[name="csrfmiddlewaretoken"]');
                if (input && input.value) return input.value;
                // 2) 쿠키 조회
                const name = 'csrftoken';
                const cookieValue = document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1];
                return cookieValue || '';
            }
            // 폼 제출 가로채기: 업로드 폼은 AJAX로 제출하여 SPA 상태 유지
            mainContent.addEventListener('submit', async (e) => {
                const form = e.target;
                if (!(form instanceof HTMLFormElement)) return;
                // 업로드 폼: id 매칭 OR 파일 인풋 존재 OR enctype이 multipart 인 경우 처리
                const isUploadLike = form.id === 'uploadForm' || form.querySelector('input[type="file"]') || (form.enctype && form.enctype.toLowerCase().includes('multipart'));
                if (!isUploadLike) return;

                e.preventDefault();

                // 업로드 엔드포인트 강건 해석: form.action 우선, 없거나 "/"로 해석되면 /training/upload/로 보정
                let actionURL;
                try {
                    // form.action은 절대경로로 resolve됨. getAttribute('action')는 상대경로일 수 있음.
                    const attr = form.getAttribute('action');
                    actionURL = new URL((attr && attr.trim().length ? attr : (form.action || '')), location.origin);
                } catch (_) {
                    actionURL = new URL(location.pathname + location.search, location.origin);
                }
                // 업로드 화면인데 action이 "/"(루트)로 박히는 경우 보정
                if ((actionURL.pathname === '/' || actionURL.pathname === '') && (activePage === 'startLearning' || actionURL.pathname.startsWith('/training'))) {
                    actionURL = new URL('/training/upload/', location.origin);
                }
                const action = actionURL.pathname + actionURL.search;
                console.debug('[upload] resolved action:', action);
                const formData = new FormData(form);

                // 버튼 로딩 상태
                const submitBtn = form.querySelector('.btn-upload');
                const originalBtnHTML = submitBtn ? submitBtn.innerHTML : null;
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 업로드/진행 중...';
                }

                try {
                    const resp = await fetch(action, {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRFToken': getCSRFToken(form)
                        },
                        body: formData,
                        credentials: 'same-origin',
                    });

                    // 디버깅 로그
                    console.debug('[upload] status:', resp.status, 'redirected:', resp.redirected, 'url:', resp.url);
                    if (resp.status === 403) {
                        console.error('[upload] 403 Forbidden (CSRF?)');
                        const text = await resp.text().catch(() => '');
                        console.debug('[upload] 403 body:', text);
                        alert('업로드 권한 오류(403). 로그인/CSRF 토큰을 확인해 주세요.');
                        return;
                    }
                    if (resp.status >= 400) {
                        const text = await resp.text().catch(() => '');
                        console.error('[upload] error body:', text);
                    }

                    // 서버가 리다이렉트하면 세션 대시보드로 로드
                    if (resp.redirected) {
                        const targetURL = new URL(resp.url, location.origin);
                        const inferred = 'sessionDashboard';
                        const titleKey = spaRoutes[inferred]?.titleKey || inferred;
                        await loadPage(targetURL.pathname + targetURL.search, t(titleKey), inferred);
                        return;
                    }

                    const contentType = resp.headers.get('content-type') || '';
                    // JSON 응답 처리 (예: {"redirect_url": "...", "status": "ok"})
                    if (contentType.includes('application/json')) {
                        const data = await resp.json();
                        if (data.redirect_url) {
                            const inferred = data.page_id || 'sessionDashboard';
                            const titleKey = spaRoutes[inferred]?.titleKey || inferred;
                            await loadPage(data.redirect_url, t(titleKey), inferred);
                            return;
                        }
                        else if (data.status === 'ok' && data.next_url) {
                            const inferred = data.page_id || 'sessionDashboard';
                            const titleKey = spaRoutes[inferred]?.titleKey || inferred;
                            await loadPage(data.next_url, t(titleKey), inferred);
                            return;
                        }
                        // 에러 메시지나 상태만 오는 경우: 일단 폼을 다시 그려서 에러표시를 보이게
                    }

                    // HTML을 돌려준 경우(유효성 에러 등): 본문만 교체하고 스크립트 재실행
                    const html = await resp.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    mainContent.innerHTML = doc.body.innerHTML;

                    // 본문 내 스크립트 재실행 (loadPage와 동일한 방식)
                    const scripts = Array.from(mainContent.querySelectorAll('script'));
                    for (const s of scripts) {
                        const ns = document.createElement('script');

                        if (s.src) {
                            ['src', 'type', 'crossorigin', 'referrerpolicy', 'integrity', 'nonce'].forEach(attr => {
                                if (s.hasAttribute(attr)) ns.setAttribute(attr, s.getAttribute(attr));
                            });
                        } else {
                            ns.textContent = s.textContent;
                            if (s.hasAttribute('type')) ns.setAttribute('type', s.getAttribute('type'));
                            if (s.hasAttribute('nonce')) ns.setAttribute('nonce', s.getAttribute('nonce'));
                        }

                        ns.setAttribute('data-spa-exec', '1');
                        s.replaceWith(ns);
                    }
                } catch (err) {
                    console.error('업로드 오류:', err);
                    alert('업로드 중 오류가 발생했습니다. 콘솔 로그를 확인해주세요.');
                } finally {
                    if (submitBtn && originalBtnHTML) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnHTML;
                    }
                }
            });

            // 폼 제출 가로채기: 세션 검색 폼(learning list)은 SPA 방식으로 처리 (세션 템플릿 수정 불필요)
            mainContent.addEventListener('submit', async (e) => {
                const form = e.target;
                if (!(form instanceof HTMLFormElement)) return;

                // 세션 검색 폼 식별: id="searchForm" 이거나, action이 "/training/sessions" 계열, 혹은 data-role="sessions-search"
                const actionAttr = (form.getAttribute('action') || '').trim();
                const isSessionsSearch = form.id === 'searchForm'
                    || form.dataset.role === 'sessions-search'
                    || actionAttr.startsWith('/training/sessions');
                if (!isSessionsSearch) return;

                e.preventDefault();
                console.debug('[sessions search] submit intercepted');

                // 버튼 로딩 상태
                const submitBtn = form.querySelector('button[type="submit"], .btn-upload');
                const originalBtnHTML = submitBtn ? submitBtn.innerHTML : null;
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 검색 중...';
                }

                try {
                    const method = (form.getAttribute('method') || 'GET').toUpperCase();
                    const attr = (form.getAttribute('action') || '').trim();
                    let actionURL;
                    try {
                        actionURL = new URL(attr && attr.length ? attr : location.pathname, location.origin);
                    } catch (_) {
                        actionURL = new URL(location.pathname + location.search, location.origin);
                    }
                    // 보정: 학습 목록에서 action이 비었거나 루트로 해석되면 세션 목록 엔드포인트로 고정
                    if ((actionURL.pathname === '/' || actionURL.pathname === '') && (activePage === 'learningList' || actionAttr.startsWith('/training'))) {
                        actionURL = new URL('/training/sessions/', location.origin);
                    }
                    console.debug('[sessions search] resolved action:', actionURL.pathname + actionURL.search, 'method:', method);

                    if (method === 'GET') {
                        // GET 폼이면 쿼리스트링만 구성해서 세션 목록 URL에 적용 후 SPA 로딩
                        const sp = new URLSearchParams(new FormData(form));
                        // actionURL가 / 이거나 비어있어도 위에서 /training/sessions/ 로 보정됨
                        const targetPath = actionURL.pathname + (sp.toString() ? '?' + sp.toString() : '');
                        const titleKey = spaRoutes.learningList?.titleKey || 'learningList';
                        await loadPage(targetPath, t(titleKey), 'learningList');
                        return;
                    }

                    // POST 폼이면 fetch로 서버에 제출하고, 응답을 파싱해서 mainContent만 갱신
                    const fd = new FormData(form);
                    const resp = await fetch(actionURL.pathname + actionURL.search, {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRFToken': getCSRFToken(form),
                        },
                        body: fd,
                        credentials: 'same-origin',
                    });

                    console.debug('[sessions search] status:', resp.status, 'redirected:', resp.redirected, 'url:', resp.url);

                    if (resp.redirected) {
                        // 리다이렉트면 해당 주소를 SPA로 다시 로드
                        const u = new URL(resp.url, location.origin);
                        const titleKey = spaRoutes.learningList?.titleKey || 'learningList';
                        await loadPage(u.pathname + u.search, t(titleKey), 'learningList');
                        return;
                    }

                    const ctype = resp.headers.get('content-type') || '';
                    if (ctype.includes('application/json')) {
                        const data = await resp.json();
                        if (data.redirect_url) {
                            const titleKey = spaRoutes.learningList?.titleKey || 'learningList';
                            await loadPage(data.redirect_url, t(titleKey), 'learningList');
                            return;
                        }
                        if (data.html) {
                            // 서버가 fragment를 내려준 경우 바로 교체
                            mainContent.innerHTML = data.html;
                            return;
                        }
                    }

                    // 기본: HTML을 받아서 통째로 교체(내부 스크립트 재실행 포함)
                    const html = await resp.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    mainContent.innerHTML = doc.body.innerHTML;
                    // 본문 내 스크립트 재실행
                    const scripts = Array.from(mainContent.querySelectorAll('script'));
                    for (const s of scripts) {
                        const ns = document.createElement('script');
                        if (s.src) {
                            ['src', 'type', 'crossorigin', 'referrerpolicy', 'integrity', 'nonce'].forEach(attr => {
                                if (s.hasAttribute(attr)) ns.setAttribute(attr, s.getAttribute(attr));
                            });
                        } else {
                            ns.textContent = s.textContent;
                            if (s.hasAttribute('type')) ns.setAttribute('type', s.getAttribute('type'));
                            if (s.hasAttribute('nonce')) ns.setAttribute('nonce', s.getAttribute('nonce'));
                        }
                        ns.setAttribute('data-spa-exec', '1');
                        s.replaceWith(ns);
                    }
                } catch (err) {
                    console.error('[sessions search] error:', err);
                    alert('검색 중 오류가 발생했습니다. 콘솔 로그를 확인해주세요.');
                } finally {
                    if (submitBtn && originalBtnHTML) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnHTML;
                    }
                }
            });

            const loadPage = async (url, title, pageId = null, opts = { push: true }) => {

                            </div>
                        </div>
                    `;

                    const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
                    if (!response.ok) throw new Error('페이지를 로드할 수 없습니다.');

                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    // --- [SPA Loader B] Adopt & inject head resources from the fetched page (styles & external scripts) ---
                    if (doc.head) {
                        // Build a set of already-present head resource keys to avoid duplicates
                        const existingKeys = new Set(
                            Array.from(document.head.querySelectorAll('link[rel="stylesheet"], script[src]'))
                                 .map(el => (el.tagName + ':' + (el.href || el.src)))
                        );

                        doc.head.querySelectorAll('link[rel="stylesheet"], script[src]').forEach(el => {
                            const key = el.tagName + ':' + (el.href || el.src);
                            if (existingKeys.has(key)) return; // skip duplicates

                            const tag = el.tagName.toLowerCase();
                            const clone = document.createElement(tag);

                            if (tag === 'link') {
                                // Copy attributes for stylesheets
                                ['rel', 'href', 'media', 'as', 'type', 'crossorigin', 'referrerpolicy', 'integrity'].forEach(attr => {
                                    if (el.hasAttribute(attr)) clone.setAttribute(attr, el.getAttribute(attr));
                                });
                            } else if (tag === 'script') {
                                // Copy attributes for external scripts (do NOT force defer/async to preserve order)
                                ['src', 'type', 'crossorigin', 'referrerpolicy', 'integrity', 'nonce'].forEach(attr => {
                                    if (el.hasAttribute(attr)) clone.setAttribute(attr, el.getAttribute(attr));
                                });
                            }

                            clone.setAttribute('data-spa-adopted', '1');
                            document.head.appendChild(clone);
                            existingKeys.add(key);
                        });
                    }
                    // -----------------------------------------------------------------------------------------------

                    const bodyContent = doc.body.innerHTML;
                    mainContent.innerHTML = bodyContent;

                    // Keep the dashboard shell but reflect virtual route via query params
                    if (pageId && opts.push) {
                        const sp = new URLSearchParams(location.search);
                        sp.set('page', pageId);
                        sp.set('src', url);
                        const newUrl = `${location.pathname}?${sp.toString()}`;
                        window.history.pushState({ url, title, pageId }, title, newUrl);
                    } else if (pageId && !opts.push) {
                        const sp = new URLSearchParams(location.search);
                        sp.set('page', pageId);
                        sp.set('src', url);
                        const newUrl = `${location.pathname}?${sp.toString()}`;
                        window.history.replaceState({ url, title, pageId }, title, newUrl);
                    }

                    if (pageId) {
                        activePage = pageId;
                    }
                    renderSidebar();
                    pageTitle.textContent = title;

                    // Re-run any inline scripts that were part of the fetched content
                    const scripts = Array.from(mainContent.querySelectorAll('script'));
                    for (const s of scripts) {
                        const ns = document.createElement('script');

                        if (s.src) {
                            // External script: keep attributes as-is
                            ['src', 'type', 'crossorigin', 'referrerpolicy', 'integrity', 'nonce'].forEach(attr => {
                                if (s.hasAttribute(attr)) ns.setAttribute(attr, s.getAttribute(attr));
                            });
                        } else {
                            // Inline script: copy code and type (including modules)
                            ns.textContent = s.textContent;
                            if (s.hasAttribute('type')) ns.setAttribute('type', s.getAttribute('type'));
                            if (s.hasAttribute('nonce')) ns.setAttribute('nonce', s.getAttribute('nonce'));
                        }

                        // Mark to avoid double execution scanning later if needed
                        ns.setAttribute('data-spa-exec', '1');
                        s.replaceWith(ns);
                    }
                } catch (error) {
                    console.error('페이지 로딩 오류:', error);
                    mainContent.innerHTML = `
                        <div class="flex items-center justify-center h-full">
                            <div class="text-center">
                                <div class="text-red-500 text-6xl mb-4">⚠️</div>

                                <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">새로고침</button>
                            </div>
                        </div>
                    `;
                }
            };

            window.addEventListener('popstate', (event) => {

                if (state && state.pageId && state.url) {

                } else {

                    const params = new URLSearchParams(location.search);
                    const page = params.get('page');
                    const src = params.get('src');
                    if (page && src) {

                        loadPage(src, t(titleKey), page, { push: false });

            const handleInitialRoute = async () => {

                if (path.startsWith('/training/')) {

                    const titleKey = spaRoutes[inferred]?.titleKey || inferred;
                    const srcUrl = path + location.search;
                    // 셸 유지: 쿼리 파라미터로 치환
                    const sp = new URLSearchParams();
                    sp.set('page', inferred);
                    sp.set('src', srcUrl);
                    const newUrl = `${location.pathname}?${sp.toString()}`;
                    window.history.replaceState({ url: srcUrl, title: t(titleKey), pageId: inferred }, t(titleKey), newUrl);
                    activePage = inferred;
                    pageTitle.textContent = t(titleKey);
                    renderSidebar();
                    await loadPage(srcUrl, t(titleKey), inferred, { push: false });
                    return true;
                }
                return false;

                                    }
                                ]
                            },
                            options: {
                                responsive: true, maintainAspectRatio: false,
                                plugins: { 
                                    legend: { labels: { color: textColor } }
                                },
                                scales: {
                                    x: { ticks: { color: textColor, maxRotation: 45 }, grid: { color: gridColor } },
                                    y: { type: 'linear', position: 'left', title: { display: true, text: t('detectionCount'), color: textColor }, ticks: { color: textColor }, grid: { color: gridColor } },
                                    y1: { type: 'linear', position: 'right', title: { display: true, text: '정확도 (%)', color: textColor }, min: 0, max: 100, ticks: { color: textColor }, grid: { drawOnChartArea: false } }
                                }
                            }
                        });

                        const doughnutOptions = { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            cutout: '60%', 
                            plugins: { 
                                legend: { position: 'right', labels: { color: textColor, boxWidth: 12, padding: 15 } }
                            } 
                        };
                        
                        charts.doughnut1 = new Chart(document.getElementById('doughnutChart1'), {
                            type: 'doughnut',
                            data: { 
                                labels: classLabels.slice(0, 3), 
                                datasets: [{ 
                                    data: detectionCounts.slice(0, 3), 
                                    backgroundColor: ['#1e88e5', '#42a5f5', '#90caf9'], 
                                    borderWidth: 0 
                                }] 
                            },
                            options: doughnutOptions
                        });

                        charts.doughnut2 = new Chart(document.getElementById('doughnutChart2'), {
                            type: 'doughnut',
                            data: { 
                                labels: [t('morning'), t('afternoon'), t('night')], 
                                datasets: [{ 
                                    data: [
                                        timeBreakdown['오전'] || 0,
                                        timeBreakdown['오후'] || 0,
                                        timeBreakdown['밤'] || 0
                                    ], 
                                    backgroundColor: ['#f59e0b', '#ea580c', '#1e3a8a'], 
                                    borderWidth: 0 
                                }] 
                            },
                            options: doughnutOptions
                        });
                    }

                    lucide.createIcons();
                    console.log('실제 DB 데이터로 대시보드 렌더링 완료');
                    
                } catch (error) {
                    console.error('실제 DB 대시보드 렌더링 실패:', error);
                    
                    // 실제 오류 상태만 표시
                    mainContent.innerHTML = `
                        <div class="bg-red-100 dark:bg-red-900/20 border border-red-300 dark:border-red-700 rounded-lg p-6">
                            <div class="flex items-center mb-4">
                                <div class="w-6 h-6 bg-red-500 rounded-full mr-3 flex items-center justify-center">
                                    <span class="text-white text-sm">!</span>
                                </div>
                                <h3 class="text-red-800 dark:text-red-200 font-semibold">실제 PostgreSQL DB 연결 실패</h3>
                            </div>
                            <p class="text-red-700 dark:text-red-300 mb-4 font-mono text-sm">${error.message}</p>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="location.reload()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                                    새로고침
                                </button>
                                <a href="/api/realtime-dashboard-data/" target="_blank" class="inline-block px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                    API 직접 확인
                                </a>
                            </div>
                        </div>
                    `;
                }
            };

            // 훈련 테이블 렌더링 함수
            const renderTrainingTable = (searchTerm = '') => {
                const tableBody = document.getElementById('training-table-body');
                if (!tableBody) return;
                tableBody.innerHTML = '';

                const filteredData = dashboardData.detections.filter(d => 
                    d.image_id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    d.detection_id.toLowerCase().includes(searchTerm.toLowerCase())
                );

                const dataToShow = filteredData.slice(0, 10);
                
                if (dataToShow.length === 0) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.colSpan = 8;
                    cell.className = 'text-center py-4 text-gray-500';
                    cell.textContent = '검색 결과가 없습니다.';
                    row.appendChild(cell);
                    tableBody.appendChild(row);
                    return;
                }

                dataToShow.forEach(d => {
                    const row = document.createElement('tr');
                    row.className = 'border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600';
                    const confidenceFormatted = (d.confidence * 100).toFixed(1) + '%';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 font-mono text-sm">${d.detection_id}</td>
                        <td class="px-6 py-4">${d.image_id}</td>
                        <td class="px-6 py-4 text-sm">${d.class}</td>
                        <td class="px-6 py-4 font-medium ${d.confidence > 0.8 ? 'text-green-500' : d.confidence > 0.6 ? 'text-yellow-500' : 'text-red-500'}">${confidenceFormatted}</td>
                        <td class="px-6 py-4">${d.precision}</td>
                        <td class="px-6 py-4">${d.recall}</td>
                        <td class="px-6 py-4">${d.map50}</td>
                        <td class="px-6 py-4">${d.map95}</td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            // 자동 새로고침
            const refreshDashboardData = async () => {
                if (activePage === 'realtimeDashboard') {
                    console.log('실시간 DB 대시보드 데이터 새로고침 중...');
                    await renderRealtimeDashboard();
                    console.log('실시간 DB 대시보드 데이터가 새로고침되었습니다.');
                }
            };

            setInterval(refreshDashboardData, 30000);

            // 초기화 - 실시간 DB 대시보드가 기본 페이지가 되도록 변경
            const init = async () => {
                const handled = await handleInitialRoute();
                updateHeaderText();
                if (!handled) {
                    // Default landing is realtimeDashboard
                    activePage = 'realtimeDashboard';
                    renderSidebar();
                    renderContent();
                }
            };

            init();
        });
    </script>
</body>
</html>
