{% load static %}
<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>대시보드</title>
        <link rel="icon" href="{% static 'favicon.ico' %}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- 상단 네비게이션 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">My Dashboard</a>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3">안녕하세요, <strong>{{ user.username }}</strong></span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- 대시보드 본문 -->
        <div class="container mt-4">
            <h2 class="mb-4">📊 대시보드</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">학습 목록 <a href="/training/" class="btn btn-primary">이동</a></h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">학습 하기 <a href="/training/upload" class="btn btn-primary">이동</a></h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
