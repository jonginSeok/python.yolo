
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그아웃 완료 - YOLO 객체 탐지 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        .card-glow {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .gradient-border {
            background: linear-gradient(135deg, #3b82f6, #e94560);
            padding: 2px;
            border-radius: 20px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="gradient-border">
            <div class="bg-gray-800 rounded-[18px] p-8 text-center relative overflow-hidden">
                <!-- 배경 장식 -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-pink-500"></div>
                
                <!-- 로고 영역 -->
                <div class="mb-6">
                    <h1 class="text-3xl font-bold gradient-text mb-2">YOLO</h1>
                    <p class="text-gray-400 text-sm">객체 탐지 대시보드</p>
                </div>
                
                <!-- 로그아웃 아이콘 -->
                <div class="mb-6">
                    <div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-500 to-pink-500 rounded-full flex items-center justify-center">
                        <span class="text-2xl">👋</span>
                    </div>
                </div>
                
                <!-- 메시지 -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-white mb-3">로그아웃 되었습니다</h2>
                    <p class="text-gray-400 text-sm leading-relaxed">
                        안전하게 로그아웃되었습니다.<br>
                        다시 로그인하려면 아래 버튼을 눌러주세요.
                    </p>
                </div>
                
                <!-- 로그인 버튼 -->
                <a href="{% url 'login' %}" 
                   class="inline-block w-full bg-gradient-to-r from-blue-500 to-pink-500 hover:from-blue-600 hover:to-pink-600 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 hover:shadow-lg">
                    로그인 페이지로 이동
                </a>
                
                <!-- 추가 정보 -->
                <div class="mt-6 pt-6 border-t border-gray-700">
                    <p class="text-gray-500 text-xs">
                        세션이 안전하게 종료되었습니다
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
