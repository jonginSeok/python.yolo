{% load form_tags %}

<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>로그인</title>
        <link rel="icon" href="{% static 'favicon.ico' %}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background-color: #f8f9fa;
            }
            .login-card {
                max-width: 400px;
                margin: auto;
                margin-top: 80px;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
                background-color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <h3 class="text-center mb-4">🔐 로그인</h3>

            {% if form.errors %}
            <div class="alert alert-danger" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">아이디</label>
                    {{ form.username|add_class:"form-control" }}
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">비밀번호</label>
                    {{ form.password|add_class:"form-control" }}
                </div>

                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}">비밀번호를 잊으셨나요?</a>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
