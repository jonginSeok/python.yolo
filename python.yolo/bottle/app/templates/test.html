<!DOCTYPE html>
<html>
<head>
    <title>테스트</title>
</head>
<body>
    <h1>템플릿이 정상 작동합니다!</h1>
    <p>API 데이터: <span id="data"></span></p>
    
    <script>
        fetch('/api/dashboard-data/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('data').textContent = JSON.stringify(data);
            });
    </script>
</body>
</html>
